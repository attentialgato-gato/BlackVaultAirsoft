# Development compose — builds image from local source.
# Usage: docker compose -f docker-compose.dev.yml up --build
services:
  blackvault:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: blackvault-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/vault.db?connection_limit=1
      - NEXT_TELEMETRY_DISABLED=1
      - IMAGE_UPLOAD_DIR=/app/data/uploads
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${DATA_DIR:-./data}/uploads:/app/uploads
      - /app/node_modules
      